{% extends "admin/base_site.html" %}
{% block content %}
<h1>Reset password for {{ user_obj.username }}?</h1>
<p>
  This immediately generates a new password and logs {{ user_obj.username }}
  out of every device — they will need the new password to log back in.
</p>
<form method="post">
  {% csrf_token %}
  <input type="submit" value="Yes, reset password" style="background:#ba2121;color:#fff;padding:8px 16px;border:none;border-radius:4px;">
  <a href="../../" style="margin-left:12px;">Cancel</a>
</form>
{% endblock %}
